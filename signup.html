<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buat akun Sho Shop">
    <title>Sho Shop - Buat Akun</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-container">
        <section class="signup-section" id="signup-section">
            <a class="auth-home-link" href="index.html">← Kembali ke Sho Shop</a>
            <div class="signup-card">
                <h1>Buat akun</h1>

                <form>
                    <div class="form-group">
                        <label for="name">Nama lengkap:</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Nama kamu"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Nomor telepon:</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Contoh: 081234567890"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Masukkan email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Kata sandi:</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Buat kata sandi"
                            required
                        >
                    </div>

                    <p class="login-text">
                        Sudah punya akun?
                        <a href="login.html" id="show-login">Masuk</a>
                    </p>

                    <button type="submit" class="signup-btn">Daftar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
