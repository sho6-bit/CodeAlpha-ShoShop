<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sho Shop">
    <title>Sho Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="auth-container">

        <aside class="left-illustration" id="left-illustration">
            <img src="assets/left.png" alt="Delivery illustration">
        </aside>

        <section class="login-section" id="login-section">

            <h1>Welcome to Sho Shop!</h1>
            <p>Let's log you in!</p>

            <div class="login-card">

                <div class="social-login">

                    <button type="button" class="social-btn">
                        <img src="assets/icon-google.png" alt="Google">
                        <span>Google</span>
                    </button>
    
                    <button type="button" class="social-btn">
                        <img src="assets/icon-phone.png" alt="Phone">
                        <span>Phone</span>
                    </button>
    
                    <button type="button" class="social-btn">
                        <img src="assets/icon-apple.png" alt="Apple">
                        <span>Apple</span>
                    </button>

                </div>

                <form class="login-form">

                    <div class="form-group">
                        <label for="email">Email :</label>
                            <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            >
                    </div>

                    <div class="form-group">
                        <label for="password">Password :</label>
                            <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            >
                    </div>

                    <a href="#" class="forgot-password">
                        Forgot your password?
                    </a>

                    <button type="submit" class="login-btn">Log In</button>

                    <p class="signup-text">
                        Don't have an account?
                        <a href="#" class="signup-link" id="show-signup">Sign Up!</a>
                    </p>
                </form>

            </div>

        </section>

        <section class="signup-section" id="signup-section" hidden>

            <div class="signup-card">

                <h1>Sign up</h1>

                <form>

                    <div class="form-group">
                        <label for="name">Full name :</label>
                            <input
                            type="name"
                            id="name"
                            name="name"
                            placeholder="John Smith"
                            required
                            >
                    </div>

                    <div class="form-group">                    
                        <label for="phone">Phone number :</label>
                            <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="e.g. 628xxxxxxxxx"
                            required
                            >
                    </div>

                    <div class="form-group">
                        <label for="email">Email :</label>
                            <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            >
                    </div>

                    <div class="form-group">
                        <label for="password">Password :</label>
                            <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            >
                    </div>

                    <p class="login-text">
                        Already have an account?
                        <a href="#" id="show-login">Sign In</a>
                    </p>

                    <button type="submit" class="signup-btn">Sign Up</button>

                </form>
            </div>
        </section>

        <aside class="right-illustration" id="right-illustration">
            <img src="assets/right.png" alt="Shopping illustration">
        </aside>

    </main>

    <script src="script.js"></script>

</body>

</html>
