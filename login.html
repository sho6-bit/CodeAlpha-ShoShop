<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Masuk ke akun Sho Shop">
    <title>Sho Shop - Masuk</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-container login-container">

        <section class="login-section" id="login-section">
            <a class="auth-home-link" href="index.html">← Kembali ke Sho Shop</a>
            <h1>Selamat datang di Sho Shop!</h1>
            <p>Masuk untuk mulai berbelanja.</p>

            <div class="login-card">
                <div class="social-login">
                    <button type="button" class="social-btn">
                        <img src="assets/icon-google.png" alt="Google">
                        <span>Google</span>
                    </button>

                    <button type="button" class="social-btn">
                        <img src="assets/icon-phone.png" alt="Phone">
                        <span>Phone</span>
                    </button>

                    <button type="button" class="social-btn">
                        <img src="assets/icon-apple.png" alt="Apple">
                        <span>Apple</span>
                    </button>
                </div>

                <form class="login-form">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Masukkan email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Kata sandi:</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan kata sandi"
                            required
                        >
                    </div>

                    <a href="#" class="forgot-password">Lupa kata sandi?</a>

                    <button type="submit" class="login-btn">Masuk</button>

                    <p class="signup-text">
                        Belum punya akun?
                        <a href="signup.html" class="signup-link" id="show-signup">Daftar</a>
                    </p>
                </form>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
